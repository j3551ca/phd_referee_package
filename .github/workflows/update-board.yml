name: Update application board
on:
  push:
    branches: [main]
    paths: [Program_Info.md, scripts/**, .github/workflows/update-board.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: application-board
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install image renderers
        run: python3 -m pip install Pillow CairoSVG
      - name: Render board and landing page
        run: |
          python3 scripts/render_board.py
          python3 scripts/render_animation.py
      - name: Save refreshed board
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/application-board.svg assets/application-board.gif assets/application-board-still.png
          if ! git diff --cached --quiet; then
            git commit -m "Refresh application board"
            git push
          fi
